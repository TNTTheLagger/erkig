<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body onload="etelleker()">
    <div style="background-color: gray;">
        <h1 class="text-center p-3" style="font-size: 200%;">Rendelés felvétel</h1>
    </div>



    <div class="text-center">
        <div class="my-2">
            <h2>Asztal száma</h2>
            <select id="asztal" class="form-select" aria-label="Default select example">
                <option selected>Open this select menu</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>

            </select>
        </div>

        <h2>Étel</h2>
        <select id="etelek" class="form-select" size="5" aria-label="Size 3 select example">
            <option selected>Open this select menu</option>
        </select>
        <h2>Étel mennyiség</h2>
        <div class="input-group input-group-lg">
            <span class="input-group-text" id="inputGroup-sizing-lg">mennyiség</span>
            <input id="mennyiseg" type="number" class="form-control" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-lg">
        </div>
        <input onclick="rendelesfeltoltes()" style="width: 100%;" value="Rendelés" type="button" class="btn-primary btn">
    </div>
    <script>
        function rendelesfeltoltes()
        {
            let asztal = document.getElementById("asztal").value;
            let etelid = document.getElementById("etelek").value;
            let mennyiseg = document.getElementById("mennyiseg").value;
            fetch("rendelesek",
                {
                    method:"POST",
                    body:JSON.stringify({"asztal":asztal,"etelid":etelid,"mennyiseg":mennyiseg})
                }
            )
            
        }
        function etelleker() {
            fetch("etelek")
                .then(response => response.json())
                .then(data => {
                    let kiteszem = document.getElementById("etelek");
                    let adatok = data;
                    for (let i = 0; i < adatok.length; i++) {
                        let etel = document.createElement("option");
                        etel.innerHTML = adatok[i].nev;
                        etel.value = adatok[i].id;
                        kiteszem.appendChild(etel);
                    }
                });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>

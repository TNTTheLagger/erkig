<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container-sm">
        <div class="row">
            <div class="col-6 list-group" id="feltoltom2" >

            </div>
            <div class="col-6 list-group" id="feltoltom" >

            </div>
        </div>

    </div>
    <div>

    </div>

    <script>
        beolvas();
        ossz();
        setInterval(() => {
            beolvas();
            ossz();
            
        }, 10000);
        function beolvas()
        {
            fetch("rendelesek")
            .then(response => response.json())
            .then(data => {
                    let adatok = data;
                    let lekerem = document.getElementById("feltoltom");
                    lekerem.innerHTML ="";

                    for (let i = 0; i < adatok.length; i++) {
                        
                            if(adatok[i].statusz == 0)
                            {
                                let etel = document.createElement("div");
                        etel.classList.add("list-group-item");
                        let gomb = document.createElement("button");
                        let gomb2 = document.createElement("button");
                        gomb.classList.add("btn","btn-primary");
                        gomb2.classList.add("btn","btn-warning");
                        gomb.addEventListener("click",()=> {statuszmodosit(adatok[i].id)})
                        gomb2.addEventListener("click",()=> {torol(adatok[i].id)})
                        gomb.innerHTML = "Főz";
                        gomb2.innerHTML = "Felszolgál";
                                etel.innerHTML ="Étel neve: " + adatok[i].nev + ",  étel mennyiség: " + adatok[i].mennyiseg;
                                lekerem.appendChild(etel);
                        etel.appendChild(gomb);
                        etel.appendChild(gomb2);
                            }
                            
                        
                        
                    }
                });
        }
        function ossz()
        {
            fetch("ossz")
            .then(response => response.json())
            .then(data => {
                    let adatok = data;
                    let lekerem2 = document.getElementById("feltoltom2");
                    lekerem2.innerHTML ="";
                    console.log(adatok);
                    for (let i = 0; i < adatok.length; i++) {
                        let etel = document.createElement("div");
                        etel.classList.add("list-group-item");
                        etel.innerHTML = adatok[i].etel_nev+" " + "mennyiség: "+adatok[i].ossz_mennyiseg;
                        lekerem2.appendChild(etel);
                    }
                });
        }
       function torol(id)
        {
            fetch(`rendelesek?id=${id}`, {method: "DELETE",})
            .then(response => {beolvas(),
            ossz()})
            
        }
        function statuszmodosit(id)
        {
            fetch(`rendelesek?id=${id}`, {method: "UPDATE",})
            .then(response => {beolvas(),
                ossz()})
        }


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
